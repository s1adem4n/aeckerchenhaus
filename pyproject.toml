[project]
name = "aeckerchenhaus"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "blender-mcp>=1.9.1",
    "ifcopenshell>=0.8.5",
]

[project.scripts]
aeckerchenhaus = "aeckerchenhaus.cli:main"

[dependency-groups]
dev = ["ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
